<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Layouter – Generator-Beispiel</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --line: #d4d4d8; --primary: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa; --line: #3f3f46; } }
    * { box-sizing: border-box }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text) }
    main { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 16px; padding: 16px; height: 100vh }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto } iframe { height: 70vh } }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto }
    h1 { font-size: 18px; margin: 0 0 4px } h2 { font-size: 14px; margin: 16px 0 6px } p { color: var(--muted); margin: 0 0 8px }
    table { width: 100%; border-collapse: collapse } td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line) } td.num, th.num { text-align: right }
    button, a.btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 5px 10px; text-decoration: none; display: inline-block }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff }
    iframe { width: 100%; height: 100%; min-height: 400px; border: 1px solid var(--line); border-radius: 6px; background: #fff }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px }
    .status { color: var(--muted); font-size: 12px }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>PDF Layouter · Generator</h1>
      <p>Die Daten kommen aus einer „Datenbank“ (JSON), die gespeicherten Layouts füllen sie, das PDF entsteht auf dem Server.</p>

      <h2>1 · Rechnungen</h2>
      <table id="invoices"><thead><tr><th>Nr.</th><th>Kunde</th><th class="num">Brutto</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row"><button class="primary" id="all-invoices">Alle Rechnungen als ein PDF</button></div>

      <h2>2 · Serienbriefe</h2>
      <table id="customers"><thead><tr><th></th><th>Empfänger</th><th>Ort</th></tr></thead><tbody></tbody></table>
      <div class="row">
        <button class="primary" id="letters">Serienbriefe erzeugen</button>
        <button id="toggle">Alle / keine</button>
        <span class="status" id="status"></span>
      </div>
    </section>
    <section><iframe id="preview" title="PDF"></iframe></section>
  </main>
  <script>
    const euro = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' })
    const $ = (s) => document.querySelector(s)
    const show = async (url) => {
      $('#status').textContent = 'Erzeuge PDF …'
      const t = performance.now()
      const res = await fetch(url)
      if (!res.ok) { $('#status').textContent = 'Fehler: ' + (await res.json()).error; return }
      const blob = await res.blob()
      $('#preview').src = URL.createObjectURL(blob)
      $('#status').textContent = `${Math.round(blob.size / 1024)} KB in ${Math.round(performance.now() - t)} ms`
    }
    Promise.all([fetch('/api/invoices').then((r) => r.json()), fetch('/api/customers').then((r) => r.json())]).then(([invoices, customers]) => {
      for (const i of invoices) {
        const c = customers.find((c) => c.id === i.customerId)
        const tr = document.createElement('tr')
        tr.innerHTML = `<td>${i.number}</td><td>${c.name}</td><td class="num">${euro.format(i.gross)}</td><td><button data-id="${i.id}">PDF</button></td>`
        $('#invoices tbody').append(tr)
      }
      for (const c of customers) {
        const tr = document.createElement('tr')
        tr.innerHTML = `<td><input type="checkbox" value="${c.id}" checked></td><td>${c.name}</td><td>${c.zip} ${c.city}</td>`
        $('#customers tbody').append(tr)
      }
    })
    $('#invoices').addEventListener('click', (e) => { const id = e.target.dataset?.id; if (id) show(`/api/invoices/${id}.pdf`) })
    $('#all-invoices').onclick = () => show('/api/invoices.pdf')
    $('#letters').onclick = () => {
      const ids = [...document.querySelectorAll('#customers input:checked')].map((i) => i.value)
      show(`/api/letters.pdf?ids=${ids.join(',')}`)
    }
    $('#toggle').onclick = () => {
      const boxes = [...document.querySelectorAll('#customers input')]
      const all = boxes.every((b) => b.checked)
      boxes.forEach((b) => (b.checked = !all))
    }
  </script>
</body>
</html>
