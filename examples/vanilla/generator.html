<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdfmake Layout Designer – Generator (Browser)</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif }
      main { display: grid; grid-template-columns: minmax(0, 460px) 1fr; gap: 16px; padding: 16px; height: 100vh; box-sizing: border-box }
      section { overflow: auto } h1 { font-size: 18px } h2 { font-size: 14px }
      table { width: 100% } td.num { text-align: right } iframe { width: 100%; height: 100%; border: 1px solid #ddd }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p><a href="/">← Designer</a></p>
        <h1>Generator <small>(PDFs entstehen im Browser)</small></h1>
        <h2>1 · Rechnungen</h2>
        <table id="invoices" data-testid="invoices"><tbody></tbody></table>
        <p><button id="all-invoices" data-testid="all-invoices">Alle Rechnungen als ein PDF</button></p>
        <h2>2 · Serienbriefe</h2>
        <table id="customers" data-testid="customers"><tbody></tbody></table>
        <p><button id="letters" data-testid="letters">Serienbriefe erzeugen</button> <span id="status" data-testid="status"></span></p>
      </section>
      <iframe id="preview" title="PDF" data-testid="preview"></iframe>
    </main>
    <script type="module" src="./generator.ts"></script>
  </body>
</html>
